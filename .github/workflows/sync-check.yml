name: Check Upstream Sync

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday
  workflow_dispatch:

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/containers/gvisor-tap-vsock.git
          git fetch upstream

      - name: Check if behind upstream
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT

          if [ "$BEHIND" -gt 0 ]; then
            echo "⚠️ Fork is $BEHIND commits behind upstream"
            exit 1
          fi

      - name: Create issue if behind
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 Upstream sync needed',
              body: 'Fork is behind upstream. Run `scripts/sync-upstream.sh` to check.',
              labels: ['maintenance', 'upstream-sync']
            })
